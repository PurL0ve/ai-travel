server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-travel-user-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

jwt:
  secret: ${JWT_SECRET:ai-travel-jwt-secret-key-2024!@#$}
  expire: 86400000
  refresh-expire: 604800000

logging:
  level:
    com.ai.travel.user: INFO
    org.springframework.security: INFO
