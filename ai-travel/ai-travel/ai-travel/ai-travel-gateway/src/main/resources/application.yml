server:
  port: 8090

spring:
  application:
    name: ai-travel-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: ai-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/ai/**
        - id: plan-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/plan/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/order/**
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/product/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
