server:
  port: 8080

spring:
  application:
    name: ai-travel-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "https://yourdomain.com"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: lb://ai-travel-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: ai-service
          uri: lb://ai-travel-ai-service
          predicates:
            - Path=/api/ai/**
        - id: plan-service
          uri: lb://ai-travel-plan-service
          predicates:
            - Path=/api/plan/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://ai-travel-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://ai-travel-product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: WARN
    org.springframework.http.server.reactive: WARN
    org.springframework.web.reactive: WARN
    reactor.netty: WARN
