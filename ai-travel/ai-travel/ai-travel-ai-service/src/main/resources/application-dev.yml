# 开发环境配置
server:
  port: 8085

spring:
  application:
    name: ai-travel-ai-service
  datasource:
    url: jdbc:mysql://localhost:3306/ai_travel?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: localhost:8848
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
    qdrant:
      host: localhost
      port: 6333

logging:
  level:
    com.ai.travel.ai: DEBUG
